<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 300px;
      padding: 15px;
      background-color: #f9f9f9;
    }
    h3 { margin-top: 0; color: #333; }
    
    /* Layout for inputs and buttons */
    #input {
      width: 100%;
      padding: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    
    .button-group {
      display: flex;
      gap: 5px;
      margin-top: 8px;
    }
    
    button {
      cursor: pointer;
      padding: 8px;
      border: none;
      border-radius: 4px;
      background-color: #007bff;
      color: white;
      transition: background 0.2s;
    }
    
    button:hover { background-color: #0056b3; }
    
    #send { flex-grow: 2; }
    #mic, #camera { flex-grow: 1; font-size: 1.2em; }

    /* Camera Preview Styling */
    #cameraPreview {
      margin-top: 10px;
      border-radius: 8px;
      background: #000;
      width: 100%;
      height: auto;
    }
    
    #capture {
      background-color: #28a745;
      margin-top: 5px;
    }

    /* Output console */
    pre {
      white-space: pre-wrap;
      word-wrap: break-word;
      background: #eee;
      padding: 10px;
      border-radius: 4px;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <h3>AutoGmail AI</h3>

  <!-- Text Input -->
  <input id="input" type="text" placeholder="Ask me anything..." />
  
  <!-- Action Buttons -->
  <div class="button-group">
    <button id="send">Send</button>
    <button id="mic" title="Voice">🎤</button>
    <button id="camera" title="Camera">📷</button>
  </div>

  <!-- Hidden by default, shown when camera is active -->
  <video id="cameraPreview" autoplay playsinline style="display:none;"></video>
  <button id="capture" style="display:none;">📸 Capture & Send</button>

  <!-- Response Area -->
  <pre id="output">Ready...</pre>

  <script src="popup.js"></script>
</body>
</html>
